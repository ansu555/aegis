<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" fill="none">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 120) rotate(90) scale(420 520)">
      <stop offset="0" stop-color="#6E5BB0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6E5BB0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 420) rotate(90) scale(320 420)">
      <stop offset="0" stop-color="#B06E8C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#B06E8C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A42"/>
      <stop offset="0.45" stop-color="#1C1C21"/>
      <stop offset="1" stop-color="#2A2A31"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1DFA6"/>
      <stop offset="1" stop-color="#B8995A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAFAFC"/>
      <stop offset="1" stop-color="#B9B9C2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="460" rx="32" fill="#050506"/>
  <rect width="1280" height="460" rx="32" fill="url(#glowA)"/>
  <rect width="1280" height="460" rx="32" fill="url(#glowB)"/>

  <!-- words -->
  <text x="88" y="196" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#title)">Tapvault</text>
  <text x="90" y="252" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#F5F5F7">Your bank card is your crypto key.</text>
  <text x="90" y="294" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9A9AA2">A NEAR wallet co-signed by your card and your phone.</text>

  <!-- pills -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#F5F5F7">
    <rect x="90" y="330" width="142" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="161" y="352" text-anchor="middle">No seed phrase</text>
    <rect x="244" y="330" width="146" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="317" y="352" text-anchor="middle">Limits on chain</text>
    <rect x="402" y="330" width="116" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="460" y="352" text-anchor="middle">Inheritance</text>
  </g>

  <!-- card -->
  <g transform="translate(760 96) rotate(-8 210 132)">
    <rect x="0" y="0" width="420" height="264" rx="26" fill="url(#card)"/>
    <rect x="0" y="0" width="420" height="264" rx="26" fill="url(#sheen)"/>
    <rect x="0.5" y="0.5" width="419" height="263" rx="25.5" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="34" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0.5" fill="#E6E6EA">tapvault</text>
    <!-- contactless -->
    <g stroke="#E6E6EA" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M362 34 q10 14 0 28"/>
      <path d="M374 26 q16 22 0 44"/>
      <path d="M386 18 q22 30 0 60"/>
    </g>
    <!-- chip -->
    <rect x="300" y="112" width="74" height="56" rx="10" fill="url(#chip)"/>
    <path d="M300 131 h74 M300 149 h74 M325 112 v56 M349 112 v56" stroke="#8C7440" stroke-opacity="0.55" stroke-width="2"/>
    <text x="34" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#5E5E66">BALANCE</text>
    <text x="34" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1" fill="#F5F5F7">128.40 NEAR</text>
    <text x="34" y="228" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" fill="#C9C9CF">•••• 4021</text>
  </g>
</svg>
