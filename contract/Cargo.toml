[package]
name = "tapvault-contract"
version = "0.1.0"
edition = "2021"
description = "NEAR contract for Tapvault: a wallet co-signed by an EMV bank card and a phone / FIDO2 P-256 key"
license = "MIT"
repository = "https://github.com/skyyycodes/tapvault"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.17.0-rust-1.86.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "~5.14"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
tapvault-core = { path = "../crates/tapvault-core" }

[dev-dependencies]
near-sdk = { version = "~5.14", features = ["unit-testing"] }
tapvault-core = { path = "../crates/tapvault-core", features = ["test-card"] }
near-workspaces = { version = "0.20", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
